<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodio | Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0f0d0c;
}

.container{
    width:400px;
    background:#1e1712;
    border:1px solid rgba(255,255,255,0.08);
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
}

.logo-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#e23744;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.logo-text{
    font-size:26px;
    font-weight:800;
    color:#f2ede8;
}

.logo-text span{
    color:#ff8a5c;
}

h2{
    text-align:center;
    color:#f2ede8;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#b0a89f;
    font-size:14px;
    margin-bottom:25px;
}

.error-box{
    background:rgba(217,48,37,0.12);
    border:1px solid rgba(217,48,37,0.4);
    color:#ff6b5c;
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:18px;
    text-align:center;
    display:none;
}

.error-box.show{
    display:block;
}

label{
    display:block;
    color:#b0a89f;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:18px;
    border:1px solid rgba(255,255,255,0.1);
    outline:none;
    border-radius:10px;
    font-size:14px;
    background:#141110;
    color:#f2ede8;
}

input:focus{
    border-color:#e23744;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#e23744;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#c91f32;
}

p.footer-text{
    text-align:center;
    margin-top:20px;
    color:#b0a89f;
    font-size:14px;
}

a{
    color:#ff8a5c;
    text-decoration:none;
    font-weight:700;
}

a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
    <div class="logo-icon">🍴</div>
    <div class="logo-text">Food<span>io</span></div>
</div>

<h2>Welcome Back</h2>
<p class="subtitle">Login to continue ordering</p>

<div class="error-box" id="errorBox">
    Invalid username or password. Please try again.
</div>

<form action="login" method="post">

<label>Username</label>
<input type="text" name="name" placeholder="Enter your username" required>

<label>Password</label>
<input type="password" name="password" placeholder="Enter your password" required>

<button type="submit">Login</button>

</form>

<p class="footer-text">
New here? <a href="signup.jsp">Create an account</a>
</p>

</div>

<script>
    var params = new URLSearchParams(window.location.search);
    if(params.get("error") !== null){
        document.getElementById("errorBox").classList.add("show");
    }
</script>

</body>
</html>
