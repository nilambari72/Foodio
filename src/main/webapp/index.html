<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodio | Good Food. Good Mood.</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0f0d0c;
    color:#e8e2dd;
    position:relative;
    overflow-x:hidden;
}

.background-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

.video-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.68);
    z-index:-1;
}

.container{
    text-align:center;
    padding:40px;
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:14px;
    background:#e23744;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

.logo-text{
    font-size:32px;
    font-weight:800;
    color:#f2ede8;
}

.logo-text span{
    color:#ff8a5c;
}

h1{
    font-size:38px;
    color:#f2ede8;
    margin-bottom:15px;
    text-shadow:0 3px 10px rgba(0,0,0,0.5);
}

h1 span{
    color:#ff6545;
}

p{
    color:#f0ebe6;
    font-size:16px;
    margin-bottom:30px;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
}

.btn-group{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:14px 28px;
    border-radius:10px;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    transition:.3s;
}

.btn-primary{
    background:#e23744;
    color:white;
}

.btn-primary:hover{
    background:#c91f32;
}

.btn-secondary{
    border:1px solid rgba(255,255,255,0.4);
    color:#f2ede8;
}

.btn-secondary:hover{
    border-color:#e23744;
    color:#ff8a5c;
    background:rgba(255,255,255,0.08);
}

</style>
</head>

<body>

<video
    class="background-video"
    autoplay
    muted
    loop
    playsinline>

    <source
        src="images/ACCC.mp4"
        type="video/mp4">

</video>

<div class="video-overlay"></div>

<div class="container">

<div class="logo">
    <div class="logo-icon">🍴</div>
    <div class="logo-text">Food<span>io</span></div>
</div>

<h1>Good Food. <span>Good Mood.</span></h1>

<p>Discover delicious food from your favourite restaurants, delivered fast.</p>

<div class="btn-group">
    <a href="Restaurant" class="btn btn-primary">🍔 Browse Restaurants</a>
    <a href="login.html" class="btn btn-secondary">Login</a>
</div>

</div>

</body>
</html>
